name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)
      kernelsu_commit:
        description: '指定 SukiSU commit hash (可选，留空使用最新)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash 或相对偏移 (如 HEAD~1)'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'
  # 缓存路径常量
  BAZEL_CACHE: /home/runner/.cache/bazel
  TOOLCHAIN_CACHE: /home/runner/.cache/toolchain
  KERNEL_SRC_CACHE: /home/runner/.cache/kernel-src

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    outputs:
      build_matrix: ${{ steps.generate.outputs.matrix }}
      kernel_version: ${{ steps.generate.outputs.kernel_version }}
      classified_matrix: ${{ steps.generate.outputs.classified_matrix }}
      matrix_summary: ${{ steps.generate.outputs.matrix_summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate build matrix
        id: generate
        run: python3 ${{ env.SCRIPTS_DIR }}/matrix_generator.py

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip xz-utils openssl pixz
          pip install PyYAML

      - name: Setup AVB signing key
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          mkdir -p toolchain/linux-x86/bin
          echo "$BOOT_SIGN_KEY" > toolchain/linux-x86/bin/testkey.pem
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/toolchain/linux-x86/bin/testkey.pem" >> $GITHUB_ENV

      # =========================================================
      # 缓存层 1: 工具链 (build-tools + mkbootimg)
      # Key 固定不变，全项目共享
      # =========================================================
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}
          key: toolchain-v1-${{ runner.os }}
          restore-keys: |
            toolchain-v1-${{ runner.os }}

      # =========================================================
      # 缓存层 2: 内核源码 (repo sync 结果)
      # Key 按 android + kernel + sub_level 区分
      # =========================================================
      - name: Restore kernel source cache
        id: cache-kernel-src
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_SRC_CACHE }}
          key: kernel-src-v2-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          restore-keys: |
            kernel-src-v2-${{ matrix.config.android }}-${{ matrix.config.kernel }}-

      # =========================================================
      # 缓存层 3: Bazel 编译缓存 (最大收益)
      # Key 按 android + kernel + sub_level + zram 区分
      # =========================================================
      - name: Restore Bazel cache
        id: cache-bazel
        uses: actions/cache@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: bazel-v3-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}-${{ github.event.inputs.use_zram }}
          restore-keys: |
            bazel-v3-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}-
            bazel-v3-${{ matrix.config.android }}-${{ matrix.config.kernel }}-

      - name: Pre-populate build environment
        run: |
          mkdir -p /tmp/gki-build
          mkdir -p ${{ env.BAZEL_CACHE }}

          SCRIPTS="$GITHUB_WORKSPACE/scripts"

          # 解压 toolchain（如果仓库内有打包文件）
          if [ -f "$SCRIPTS/toolchain.tar.gz" ]; then
            echo "从本地解压 toolchain..."
            tar xzf "$SCRIPTS/toolchain.tar.gz" -C /tmp/gki-build
            echo "toolchain 已就绪: $(ls /tmp/gki-build/toolchain 2>/dev/null | head -3)"
          else
            echo "⚠ toolchain.tar.gz 不存在，将在构建时联网克隆"
          fi

          # 解压 mkbootimg
          if [ -f "$SCRIPTS/mkbootimg.tar.gz" ]; then
            echo "从本地解压 mkbootimg..."
            tar xzf "$SCRIPTS/mkbootimg.tar.gz" -C /tmp/gki-build
            echo "mkbootimg 已就绪: $(ls /tmp/gki-build/mkbootimg 2>/dev/null | head -3)"
          else
            echo "⚠ mkbootimg.tar.gz 不存在，将在构建时联网克隆"
          fi

          # 复制 repo 工具脚本
          if [ -f "$SCRIPTS/repo" ]; then
            echo "从本地复制 repo 工具..."
            cp "$SCRIPTS/repo" /tmp/repo
            chmod +x /tmp/repo
            echo "repo 已就绪: $(head -1 /tmp/repo)"
          else
            echo "⚠ scripts/repo 不存在，将在构建时联网下载"
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -x
          cd ${{ env.SCRIPTS_DIR }}
          echo "=== SCRIPTS DIR ==="
          pwd && ls -la
          echo "=== Build args ==="
          ARGS="--android ${{ matrix.config.android }}"
          ARGS="$ARGS --kernel ${{ matrix.config.kernel }}"
          ARGS="$ARGS --sub-level ${{ matrix.config.sub_level }}"
          ARGS="$ARGS --os-patch ${{ matrix.config.os_patch }}"
          [ -n "${{ matrix.config.revision }}" ] && ARGS="$ARGS --revision ${{ matrix.config.revision }}"
          ARGS="$ARGS --ksu-version ${{ github.event.inputs.kernelsu_version }}"
          ARGS="$ARGS --no-release"
          ARGS="$ARGS -w /tmp/gki-build"
          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_kpm }}" = "false" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version=${{ github.event.inputs.custom_version }}"
          echo "Building: python3 build.py $ARGS"
          LOG_FILE="${{ github.workspace }}/build-logs/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}.log"
          mkdir -p "${{ github.workspace }}/build-logs"
          set +e
          python3 build.py $ARGS 2>&1 | tee "$LOG_FILE"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "EXIT_CODE=$BUILD_EXIT"
          echo "=== ERRORS ==="
          grep -n "error:" "$LOG_FILE" | tail -80 || echo "no errors"
          echo "=== FAILED ==="
          grep -in "failed\|FAILED" "$LOG_FILE" | tail -30 || echo "no failed"
          echo "=== TAIL ==="
          tail -50 "$LOG_FILE"
          exit $BUILD_EXIT

      - name: Display build errors
        if: always()
        run: |
          LOG_FILE="${{ github.workspace }}/build-logs/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}.log"
          if [ -f "$LOG_FILE" ]; then
            echo "Log file exists, size: $(wc -c < "$LOG_FILE") bytes"
            ERROR_COUNT=$(grep -ci "error:" "$LOG_FILE" 2>/dev/null || echo 0)
            echo "Errors found: $ERROR_COUNT"
            echo "### Build Errors ($ERROR_COUNT)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -n "error:" "$LOG_FILE" | tail -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 50 lines" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 "$LOG_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No build log file found"
          fi

      - name: Save kernel source cache
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_SRC_CACHE }}
          key: kernel-src-v2-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}

      - name: Save Bazel cache
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: bazel-v3-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}-${{ github.event.inputs.use_zram }}

      - name: Save toolchain cache
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}
          key: toolchain-v1-${{ runner.os }}

      - name: Upload build logs
        if: always()
        run: |
          mkdir -p build-results
          LOG_DIR="${{ github.workspace }}/build-logs"
          if [ -d "$LOG_DIR" ] && [ -n "$(ls -A "$LOG_DIR" 2>/dev/null)" ]; then
            ls -la "$LOG_DIR"
            echo "Build logs found:"
            for f in "$LOG_DIR"/*.log; do
              if [ -f "$f" ]; then
                cp "$f" "build-results/"
                echo "Copied: $f"
              fi
            done
          else
            echo "No build logs found"
          fi

      - name: Prepare artifacts
        id: prepare-artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "没有找到构建产物"
            echo "artifacts_exist=false" >> $GITHUB_OUTPUT
          else
            echo "artifacts_exist=true" >> $GITHUB_OUTPUT
            ls -la artifacts/
            cd artifacts && sha256sum * > SHA256SUMS.txt && cd ..
          fi

      - name: Upload artifacts
        if: steps.prepare-artifacts.outputs.artifacts_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          path: artifacts/*

      - name: Record build result
        if: always()
        run: |
          mkdir -p build-results
          if [ -f "artifacts/SHA256SUMS.txt" ]; then
            cp artifacts/SHA256SUMS.txt build-results/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}.txt
          fi
          echo "${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}:outcome=${{ job.status }}" >> build-results/status.txt
          # Copy build log to build-results if exists
          LOG_FILE="${{ github.workspace }}/build-logs/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}.log"
          if [ -f "$LOG_FILE" ]; then
            cp "$LOG_FILE" "build-results/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}.log"
          fi

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          path: build-results/
          retention-days: 1

  release:
    needs: [prepare, build]
    if: ${{ github.event.inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          pattern: 'kernel-*'
          merge-multiple: true

      - name: Download build results
        uses: actions/download-artifact@v8
        with:
          pattern: 'build-results-*'
          path: build-results
          merge-multiple: true

      - name: Prepare build summary
        id: prepare-summary
        run: |
          mkdir -p build-results
          echo "=== 构建摘要 ===" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(cat build-results/status.txt 2>/dev/null | wc -l || echo 0)
          SUCCESS=$(grep ':outcome=success$' build-results/status.txt 2>/dev/null | wc -l || echo 0)
          FAILED=$(grep ':outcome=failure$' build-results/status.txt 2>/dev/null | wc -l || echo 0)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "| Total | Success | Failed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| $TOTAL | $SUCCESS | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "=== 状态 ==="
          cat build-results/status.txt 2>/dev/null || echo "No status file"

      - name: Prepare release files
        id: prepare-release-files
        if: steps.prepare-summary.outputs.success != '0'
        run: |
          mkdir -p release-files
          python3 ${{ env.SCRIPTS_DIR }}/extract_artifacts.py all-artifacts release-files --build-results build-results
          ls -la release-files/

      - name: Generate release body
        if: steps.prepare-summary.outputs.success != '0'
        run: |
          python3 ${{ env.SCRIPTS_DIR }}/release_generator.py ${{ env.WORKSPACE_ROOT }}/release-files/RELEASE_BODY.md
          echo "=== 发布内容 ==="
          cat release-files/RELEASE_BODY.md

      - name: Create release
        if: steps.prepare-summary.outputs.success != '0'
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}
          name: GKI Kernel ${{ needs.prepare.outputs.kernel_version }}
          draft: false
          generate_release_notes: false
          files: |
            release-files/*
          body_path: release-files/RELEASE_BODY.md

      - name: Get release URL
        if: steps.prepare-summary.outputs.success != '0'
        id: get-release-url
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.kernel_version }}"
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "Release URL: $RELEASE_URL"

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SUCCESS: ${{ steps.prepare-summary.outputs.success }}
          FAILED: ${{ steps.prepare-summary.outputs.failed }}
        run: |
          if [ "$SUCCESS" -gt 0 ]; then
            python3 ${{ env.SCRIPTS_DIR }}/telegram_notify.py release \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ steps.get-release-url.outputs.release_url }}" \
              "${{ env.WORKSPACE_ROOT }}/release-files/RELEASE_BODY.md" \
              "" \
              "" \
              "$SUCCESS" \
              "$FAILED"
          else
            python3 ${{ env.SCRIPTS_DIR }}/telegram_notify.py release \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ steps.get-release-url.outputs.release_url }}" \
              "" \
              "" \
              "" \
              "0" \
              "${{ steps.prepare-summary.outputs.total }}"
          fi
